name: Command Center API CI

on:
  pull_request:
    paths:
      - 'sri-command-center-api/**'
      - 'sri-command-center/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sri-command-center-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run task proposal safety tests
        run: python -m pytest -q tests/test_task_proposals.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sri-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck and build operator console
        run: npm run build
