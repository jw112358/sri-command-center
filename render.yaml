services:
  # ── Backend API (FastAPI + uvicorn) ─────────────────────────────────────────
  - type: web
    name: sri-command-center-api
    runtime: python
    rootDir: sri-command-center-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DRIVE_ROOT_FOLDER_ID
        value: 18LyrWJbV2L01N_6T52BmPcsRr1nJjBcV
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false   # secret service-account JSON; share only the SRI Drive root
      - key: DASHBOARD_DRIVE_WRITE_ENABLED
        value: "false" # enable after the service account and Jeff sign-in are verified
      - key: COMMAND_DISPATCH_ENABLED
        value: "false" # enable only after an OS runner consumes and acknowledges commands
      - key: DASHBOARD_SESSION_SUMMARIES_FOLDER_ID
        value: 18izBaGlyEQBF8aWaGRajxTRp_oO9ejWk
      - key: LEGAL_GOOGLE_CLIENT_ID
        sync: false
      - key: LEGAL_SESSION_SECRET
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false   # set in Render dashboard — never commit
      - key: CACHE_TTL
        value: "300"
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /api/health
    plan: pro

  # ── Frontend (React + Vite static site) ─────────────────────────────────────
  - type: web
    name: sri-command-center
    runtime: static
    rootDir: sri-command-center
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Set this to the deployed backend URL after first deploy, e.g.:
        # https://sri-command-center-api.onrender.com
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://sri-command-center-api.onrender.com wss://sri-command-center-api.onrender.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
